volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:14.7
    restart: always
    env_file:
      - infra/.env
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  backend:
#    build:
#      context: ./backend
#      dockerfile: Dockerfile
    image: allay6/fg-backend
    restart: always
    env_file:
      - infra/.env
    volumes:
      - ./backend:/app
      - static:/app/static
      - ./backend/media:/app/media
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        while ! nc -z db 5432; do sleep 2; echo 'Waiting for PostgreSQL...'; done &&
        python manage.py migrate &&
        python manage.py collectstatic --no-input &&
        (gunicorn --bind 0.0.0.0:8000 foodgram.wsgi:application & daphne -b 0.0.0.0 -p 8001 foodgram.asgi:application)
      "
    networks:
      - backend-network

  frontend:
#    build:
#      context: ./frontend
#      dockerfile: Dockerfile
    image: allay6/fg-frontend
    restart: always
    networks:
      - backend-network

  nginx:
    container_name: foodgram-proxy
    image: nginx:alpine
    restart: always
    ports:
      - "8081:80"
    volumes:
      - ./frontend/build:/usr/share/nginx/html
      - ./backend/media:/var/html/media
      - ./frontend/infra/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge
